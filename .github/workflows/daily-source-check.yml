name: Daily university-source check
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/catalog.*'
      - 'scripts/**'
      - '.github/workflows/daily-source-check.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: teachertrack-pages
  cancel-in-progress: false
jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update monitored-source log
        run: python scripts/check_updates.py
      - name: Commit new daily log and source fingerprints
        run: |
          git config user.name "teachertrack-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor.json data/source_snapshots.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily source check"
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
